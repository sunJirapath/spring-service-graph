openapi: 3.0.3
info:
  title: Admin API
  version: 1.0.0
servers:
  - url: http://localhost:8081/admin
paths:
  /accounts/{id}:
    delete:
      operationId: deleteAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Account deleted

spring.application.name=gateway-edge
spring.cloud.gateway.routes[0].id=modern
spring.cloud.gateway.routes[0].uri=lb://modern-svc
spring.cloud.gateway.routes[0].predicates[0]=Path=/edge/modern/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].id=forward
spring.cloud.gateway.routes[1].uri=forward:/fallback
spring.cloud.gateway.routes[1].predicates[0]=Path=/local/**
spring.cloud.gateway.routes[2].id=unknown
spring.cloud.gateway.routes[2].uri=lb://ghost-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/unknown/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
edge.password=fake-password-123
